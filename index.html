<!DOCTYPE html>
<html>
<head>
  <title>Haru Hub</title>
  <style>
    /* 🌌 Animated Northern Lights Background */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      overflow-y: scroll;
      background: linear-gradient(-45deg, #001f3f, #003f5c, #2d0066, #004d40);
      background-size: 400% 400%;
      animation: aurora 10s ease infinite;
    }

    @keyframes aurora {
      0% {background-position: 0% 50%;}
      50% {background-position: 100% 50%;}
      100% {background-position: 0% 50%;}
    }

    /* Header */
    .header {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .header h1 {
      font-size: 50px;
      margin: 0;
      text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    .header p {
      color: #ccc;
      margin-top: 10px;
    }

    /* Scroll section */
    .content {
      min-height: 100vh;
      padding: 60px 20px;
      text-align: center;
    }

    /* Buttons */
    .button {
      display: block;
      width: 260px;
      margin: 15px auto;
      padding: 16px;
      border-radius: 20px;
      background: rgba(255,255,255,0.08);
      color: white;
      text-decoration: none;
      font-size: 16px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      transition: 0.3s;
      box-shadow: 0 0 15px rgba(0,0,0,0.3);
    }

    .button:hover {
      transform: scale(1.05);
      background: rgba(255,255,255,0.18);
      box-shadow: 0 0 20px rgba(0,255,200,0.4);
    }

    /* Footer */
    .footer {
      margin-top: 60px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <!-- 🌟 HERO SECTION -->
  <div class="header">
    <h1>WELCOME TO HARU HUB!</h1>
    <p>Training • Sessions • Community</p>
    <p>⬇ Scroll down ⬇</p>
  </div>

  <!-- 📜 BUTTON SECTION -->
  <div class="content">

    <a class="button" href="https://www.roblox.com/communities/804007244/scoff#!/about">
      🎮 Join Roblox Group
    </a>

    <a class="button" href="https://discord.gg/VqV5vQh5Z3">
      💬 Join Discord
    </a>

    <a class="button" href="https://www.roblox.com/games/131888139540719/Har-Training-Center">
      📍 Training Center
    </a>

    <div class="footer">
      Haru Hub © 2026
    </div>

  </div>

</body>
</html>
